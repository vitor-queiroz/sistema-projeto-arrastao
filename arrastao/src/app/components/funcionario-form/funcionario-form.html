<h2>{{ funcionario ? 'Editar Funcionário' : 'Novo funcionario' }}</h2>

<div class="campo">

    <label>Nome</label>
    <input
        type="text"
        [(ngModel)]="nome">

</div>

<div class="campo">

    <label>CPF</label>
    <input
        type="text"
        [(ngModel)]="cpf">

</div>

<div class="campo">

    <label>RG</label>
    <input
        type="text"
        [(ngModel)]="rg">

</div>

<div class="campo">

    <label>Data de Nascimento</label>
    <input
        type="date"
        [(ngModel)]="dataNascimento">

</div>

<div class="campo">

    <label>Cargo</label>
    <input
        type="text"
        [(ngModel)]="cargo">

</div>

<div class="campo">

    <label>Setor</label>
    <input
        type="text"
        [(ngModel)]="setor">

</div>

<div class="campo">

    <label>Admissão</label>
    <input
        type="date"
        [(ngModel)]="admissao">

</div>

<button (click)="salvar()">
    Salvar
</button>
