<h2>Confirmar Cadastro</h2>

<p>
    Digite o código de 6 dígitos recebido.
</p>

<div>
    <label>Código de confirmação</label>

    <input
        type="text"
        maxlength="6"
        inputmode="numeric"
        pattern="[0-9]*"
        [(ngModel)]="codigo"
        placeholder="Digite o código"
    >
</div>

<button (click)="confirmar()">
    Confirmar
</button>
