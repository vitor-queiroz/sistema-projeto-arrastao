<header class="topbar">

    <div class="topbar-left">

        <button class="menu-btn" (click)="menuAberto = !menuAberto">
            ☰
        </button>

        <h2>Arrastão</h2>

    </div>

    <div class="topbar-right">

        <input type="text" placeholder="Pesquisar...">

        <div class="user">

            <div class="avatar">
                V
            </div>

            <span>Vitor</span>

        </div>

    </div>

</header>

<aside class="sidebar" [class.aberto]="menuAberto">

    <nav>

        <a routerLink="/painel">
            Início
        </a>

        <a routerLink="/funcionarios">
            Funcionários
        </a>

        <a routerLink="/documentos">
            Documentos
        </a>

        @if (authService.isSuperAdmin()){
        <a routerLink="/usuarios">
            Usuários
        </a>
        }
    </nav>

</aside>

<main>

    <router-outlet></router-outlet>

</main>
