<section class="documentos">

    <div class="cabecalho-documentos">
        <h1>📄 Documentos</h1>

        <button class="novo-documento" (click)="abrirModal()">
            ➕ Novo Documento
        </button>
    </div>

    <table *ngIf="documentos.length > 0">

        <thead>

            <tr>

                <th>Funcionário</th>
                <th>Tipo</th>
                <th>Arquivo</th>
                <th>Enviado por</th>
                <th>Data</th>
                <th>Ações</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let documento of documentos">

                <td>{{ documento.funcionarioNome }}</td>
                <td>{{ documento.tipo }}</td>
                <td>{{ documento.nomeArquivo }}</td>
                <td>{{ documento.enviadoPor }}</td>
                <td>{{ documento.dataUpload }}</td>

                <td class="acoes">
                    <button class="visualizar" *ngIf="documento.url" (click)="abrirDocumento(documento.url)">
                        👁️ Visualizar
                    </button>

                    <button class="editar" (click)="editarDocumento(documento)">
                        ✏️
                    </button>

                    <button class="excluir" (click)="excluirDocumento(documento)">
                        🗑️
                    </button>

                </td>

            </tr>

        </tbody>

    </table>

    <div class="sem-documentos" *ngIf="documentos.length === 0">
        📂 Nenhum documento cadastrado.
    </div>

    <div class="modal" *ngIf="modalAberto">

        <div class="modal-conteudo">

            <button type="button" (click)="fecharModal()">
                ✕
            </button>

            <app-documento-form [documento]="documentoSelecionado" (salvou)="aoSalvarDocumento()">
            </app-documento-form>

        </div>

    </div>

</section>
