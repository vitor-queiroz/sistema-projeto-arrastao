<section class="documentos">

    <div class="cabecalho-documentos">
        <h1>📄 Documentos</h1>

        <button class="novo-documento" (click)="abrirModal()">
            ➕ Novo Documento
        </button>
    </div>

    <table>

        <thead>

            <tr>

                <th>Funcionário</th>
                <th>Tipo</th>
                <th>Arquivo</th>
                <th>Enviado por</th>
                <th>Data</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let documento of documentos">

                <td>{{ documento.funcionarioNome }}</td>
                <td>{{ documento.tipo }}</td>
                <td>{{ documento.arquivo }}</td>
                <td>{{ documento.enviadoPor }}</td>
                <td>{{ documento.dataUpload }}</td>

            </tr>

        </tbody>

    </table>

    <div class="modal" *ngIf="modalAberto">

        <div class="modal-conteudo">

            <h2>📄 Novo Documento</h2>

            <button type="button" (click)="fecharModal()">
                ✕
            </button>

            <hr>

            <label>Funcionário</label>

            <select [(ngModel)]="novoDocumento.funcionarioId">

                <option value="">Selecione um funcionário</option>

                <option *ngFor="let funcionario of funcionarios" [value]="funcionario.id">

                    {{ funcionario.nome }}

                </option>

            </select>

            <br><br>

            <label>Tipo do documento</label>

            <select [(ngModel)]="novoDocumento.tipo">

                <option value="">Selecione</option>

                <option>RG</option>
                <option>CPF</option>
                <option>Carteira de Trabalho</option>
                <option>Contrato</option>
                <option>Holerite</option>
                <option>ASO</option>
                <option>Comprovante de Residência</option>
                <option>Outros</option>

            </select>

            <br><br>

            <label>Nome do arquivo</label>

            <input type="text"
             placeholder="Ex.: rg_maria.pdf"
              [(ngModel)]="novoDocumento.nomeArquivo">

            <br><br>

           <div class="acoes-modal"> 
            <button type="button" (click)="fecharModal()">
                Cancelar
            </button>

            <button type="button" (click)="salvarDocumento()">
                Salvar Documento
            </button>
           </div> 
        </div>

    </div>

</section>
